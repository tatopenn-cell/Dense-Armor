# Codecov configuration.
#
# The patch gate measures the `dense_armor` package, not the benchmark
# scripts, the tests or the documentation pages. The benchmarks are
# runnable scripts, not library code, and they are not imported by any
# test; their lines would count as uncovered in the diff even though
# `--cov=dense_armor` never asked for them. The patch is measured on
# the lines of `dense_armor/` only.

ignore:
  - "benchmarks"
  - "test"
  - "docs"
  # Paths that no longer exist. On 2026-11-12 the folders `core` and `utility`
  # of `dense_armor` swapped their names. The reports uploaded before that day
  # (and carried forward, see below) list the library under the old names, so
  # every folder was counted twice: once covered under `core/`, once at 0%
  # under `utility/`. That put the project at 53% instead of 94%. These paths
  # are not in the repository; listing them here removes only the stale copies.
  - "dense_armor/utility/_validation.py"
  - "dense_armor/utility/deep"
  - "dense_armor/utility/evaluation"
  - "dense_armor/utility/finance"
  - "dense_armor/utility/infrastructure"
  - "dense_armor/utility/online"
  - "dense_armor/utility/robot"
  - "dense_armor/utility/signals"
  - "dense_armor/core/damping_operator.py"
  - "dense_armor/core/engine.py"
  - "dense_armor/core/hybrid_engine.py"
  - "dense_armor/core/memory.py"
  - "dense_armor/core/noise.py"
  - "dense_armor/core/preset.py"

coverage:
  status:
    project:
      default:
        target: 96%
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

# Carry the last uploaded value of each flag forward when the workflow
# does not run on a commit.  The `tests` workflow is skipped on docs-only
# commits, so its (default) flag is not uploaded; without carryforward,
# Codecov sees the flag as missing and the patch status drops to the
# files covered by the other flags only (33% on 25577cf, a docs-only
# commit).  With carryforward, a docs-only commit keeps the coverage of
# the previous code commit.
flag_management:
  default_rules:
    carryforward: true
  # The `finance-dashboard` workflow runs pytest but no longer uploads a
  # report. Its last upload, from before the core/utility rename, lists
  # the library under `dense_armor/utility/` (about 28 000 lines at 2%),
  # and carryforward copied it to every later commit, so the project read
  # 54% instead of 97%. Without carryforward the stale flag drops out of
  # the report.
  individual_flags:
    - name: finance-dashboard
      carryforward: false

