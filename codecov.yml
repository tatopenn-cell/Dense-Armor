# Codecov configuration.
#
# The patch gate measures the `dense_armor` package, not the benchmark
# scripts, the tests or the documentation pages. The benchmarks are
# runnable scripts, not library code, and they are not imported by any
# test; their lines would count as uncovered in the diff even though
# `--cov=dense_armor` never asked for them. The patch is measured on
# the lines of `dense_armor/` only.

ignore:
  - "benchmarks"
  - "test"
  - "docs"

coverage:
  status:
    project:
      default:
        target: 96%
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

# Carry the last uploaded value of each flag forward when the workflow
# does not run on a commit.  The `tests` workflow is skipped on docs-only
# commits, so its (default) flag is not uploaded; without carryforward,
# Codecov sees the flag as missing and the patch status drops to the
# files covered by the other flags only (33% on 25577cf, a docs-only
# commit).  With carryforward, a docs-only commit keeps the coverage of
# the previous code commit.
flag_management:
  default_rules:
    carryforward: true

