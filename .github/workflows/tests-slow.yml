name: tests-slow

on:
  push:
    branches: [master]
    paths:
      - "dense_armor/**"
      - "test/**"
      - "pytest.ini"
      - ".github/workflows/tests-slow.yml"
  pull_request:
    branches: [master]
    paths:
      - "dense_armor/**"
      - "test/**"
      - "pytest.ini"
      - ".github/workflows/tests-slow.yml"

jobs:
  slow:
    name: ${{ matrix.name }} (Python 3.12, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: training
            args: "test/neural -m training"
          - name: heavy-dynamics
            args: "test/dynamics -m heavy"
          - name: heavy-rest
            args: "test --ignore=test/dynamics -m heavy"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: pip install -e ".[dev,audio,data,mcp,ros]" opencv-python-headless pillow

      - name: Run the tests
        env:
          JAX_ENABLE_X64: "True"
        run: pytest ${{ matrix.args }} -v --cov=dense_armor --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
