name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # code == true whenever anything OTHER than docs/README/CHANGELOG
          # changed -- same mechanism validated in Dense-Evolution's own CI.
          # predicate-quantifier MUST be "every" (AND across patterns), not
          # paths-filter's default "some" (OR): '**' matches every file
          # unconditionally, so under "some" the '!'-exclusions below never
          # exclude anything and `code` would be true even for a pure
          # README-only change.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!mkdocs.yml'
              - '!README.md'
              - '!CHANGELOG.md'
              - '!LICENSE.md'

  pytest:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'

      - name: Set up Python ${{ matrix.python-version }}
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        if: needs.changes.outputs.code == 'true'
        run: pip install -e ".[dev,audio,data,mcp]"

      - name: Run pytest
        if: needs.changes.outputs.code == 'true'
        env:
          JAX_ENABLE_X64: "True"
        run: pytest test/ -v --cov=dense_armor --cov-report=xml --cov-report=term-missing

      # Solo una gamba della matrice carica su Codecov -- 6 upload identici
      # (uno per combinazione OS/Python) non aggiungono informazione, solo
      # rumore nella cronologia di Codecov.
      - name: Upload coverage to Codecov
        if: needs.changes.outputs.code == 'true' && matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-check:
    name: build sdist/wheel
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'

      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        if: needs.changes.outputs.code == 'true'
        run: pip install build twine

      - name: Build package
        if: needs.changes.outputs.code == 'true'
        run: python -m build

      - name: Validate package metadata
        if: needs.changes.outputs.code == 'true'
        run: python -m twine check dist/*
