name: tests

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "ARCHITECTURE.md"
      - "LICENSE"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "ARCHITECTURE.md"
      - "LICENSE"
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: pip install -e ".[dev,audio,data,mcp,ros]" opencv-python-headless pillow

      - name: Install torch (CPU) for the bridge tests
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install tensorflow (CPU) for the bridge tests
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: pip install tensorflow-cpu

      - name: Run pytest
        env:
          JAX_ENABLE_X64: "True"
          COV: ${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' && '--cov=dense_armor --cov-report=xml --cov-report=term-missing' || '' }}
        run: pytest test/ -q -m "not training and not heavy and not slow" $COV

      # Solo una gamba della matrice carica su Codecov -- 6 upload identici
      # (uno per combinazione OS/Python) non aggiungono informazione, solo
      # rumore nella cronologia di Codecov.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
