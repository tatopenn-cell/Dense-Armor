<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Robot layer — interactive map</title>
<style>
  html,body{margin:0;padding:0;background:#05070c;color:#e6eef5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(440px,600px);gap:0;
        max-width:1700px;margin:0 auto;height:100vh;overflow:hidden}
  .stage{display:flex;align-items:center;justify-content:center;padding:14px;min-height:0}
  .img-wrap{position:relative;max-height:94vh;max-width:100%;aspect-ratio:1/1}
  .img-wrap img{width:100%;height:100%;display:block;object-fit:contain}
  .connections{position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:1}
  .connections line{stroke:rgba(94,197,197,0.35);stroke-width:0.35;
    vector-effect:non-scaling-stroke;stroke-linecap:round}
  .hotspot{position:absolute;cursor:pointer;z-index:2;border-radius:50%;
    border:1px solid rgba(94,197,197,0);
    transition:background .15s,border-color .15s,box-shadow .15s}
  .hotspot:hover{background:rgba(94,197,197,.22);border-color:rgba(94,197,197,.8);
                  box-shadow:0 0 18px rgba(94,197,197,.6)}
  .hotspot.active{background:rgba(232,155,74,.28);border-color:rgba(232,155,74,.9);
                  box-shadow:0 0 22px rgba(232,155,74,.7)}

  .panel{padding:1.4rem 1.6rem;background:#0a121b;overflow-y:auto;
          height:100vh;font-size:.9rem;line-height:1.4}
  .panel h3{margin:0 0 1rem;color:#5ec5c5;font-size:1.25rem;
            border-bottom:1px solid #1c2a3a;padding-bottom:.6rem;font-weight:600}
  .panel p.lead{margin:0 0 1rem;color:#9fb3c2;font-size:.9rem;line-height:1.5}
  .panel .cat{margin:0 0 .8rem;color:#e89b4a;font-weight:600;
              font-size:.88rem;text-transform:uppercase;letter-spacing:.06em}
  .panel .cat .cnt{color:#6a7a8a;font-weight:400;font-size:.8rem;
                    text-transform:none;letter-spacing:0}

  .api-list{display:flex;flex-direction:column;gap:2px;margin-bottom:1.5rem}
  .api-item{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;
            padding:.55rem .7rem;background:#0e1824;border-left:3px solid #1f3851;
            border-radius:4px;text-decoration:none;
            transition:background .12s,border-left-color .12s}
  .api-item:hover{background:#122031;border-left-color:#5ec5c5}
  .api-name{color:#7fcfff;font-weight:600;font-size:.92rem;
            grid-column:1;grid-row:1;line-height:1.3}
  .api-kind{color:#4a5a6a;font-size:.72rem;font-style:italic;
            grid-column:2;grid-row:1;align-self:center;padding-left:.6rem}
  .api-brief{color:#a8b8c8;font-size:.82rem;margin-top:.2rem;
             grid-column:1 / -1;grid-row:2;line-height:1.4}

  @media(max-width:1000px){
    .wrap{grid-template-columns:1fr;height:auto}
    .panel{height:auto;max-height:none}
  }
</style>
</head>
