[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-armor"
version = "1.6.0"
description = "Low-Level Learning toolkit on three levels: online learning (one sample at a time), deep learning (neural networks) and machine learning (the whole dataset); with ontology, audio, robot motion control, video and finance"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Salvatore Pennacchio", email = "jtatopenn@libero.it" }]
requires-python = ">=3.10"
keywords = ["online-learning", "deep-learning", "machine-learning", "streaming", "robotics", "robot-control", "anomaly-detection", "drift-detection", "ontology", "audio", "video", "finance", "ai-safety", "robust-statistics", "jax"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = ["numpy", "jax", "psutil", "osqp", "scipy", "xacro"]

[project.optional-dependencies]
tensorflow = ["tensorflow-cpu>=2.16"]
torch = ["torch>=2.0"]
sklearn = ["scikit-learn>=1.6"]
finance-stream = ["pyzmq>=25", "confluent-kafka>=2"]
audio = ["scipy", "sounddevice"]
data = ["h5py", "netCDF4"]
graph = ["networkx", "pygsp>=0.6"]
dag = ["networkx"]  # kept for old install commands: the DAG no longer needs it
onto = ["networkx"]  # kept for old install commands: the ontology no longer needs it
causal = ["dowhy", "pandas"]
quantum = ["dense-evolution"]
mcp = ["mcp>=2.0.0", "pydantic>=2.0"]
river = ["river>=0.26; python_version >= '3.11'"]
vision = ["opencv-python"]
drone = ["pyulog", "pymavlink", "paho-mqtt", "pyyaml"]
ros = ["rosbags>=0.9.18"]
llm = []  # the LLM bridge needs no extra package
finance-ops = ["flask", "sqlalchemy", "alembic", "psycopg2-binary", "playwright", "quickfix"]
dev = ["pytest", "pytest-cov", "coverage>=7.10", "filterpy", "matplotlib", "river>=0.26; python_version >= '3.11'", "scikit-learn", "flask", "networkx", "pygsp>=0.6", "pandas", "dowhy"]
docs = [
    "mkdocs>=1.6.0",
    "ruff>=0.6",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
    "pymdown-extensions>=10.0,<11.0",
]

[project.urls]
Homepage = "https://github.com/tatopenn-cell/Dense-Armor"
Repository = "https://github.com/tatopenn-cell/Dense-Armor"
Documentation = "https://tatopenn-cell.github.io/Dense-Armor/"
Changelog = "https://github.com/tatopenn-cell/Dense-Armor/blob/master/CHANGELOG.md"
Issues = "https://github.com/tatopenn-cell/Dense-Armor/issues"
"Sister project (Dense-Evolution)" = "https://github.com/tatopenn-cell/Dense-Evolution"

[project.scripts]
dense-armor = "dense_armor.armor:main"
dense-armor-mcp = "dense_armor.mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["dense_armor*", "pipelines*"]

[tool.coverage.run]
patch = ["subprocess"]

[tool.ruff]
target-version = "py310"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"dense_armor/__init__.py" = ["E402"]
"dense_armor/checks/check_estimator.py" = ["E402"]
"dense_armor/roles/__init__.py" = ["E402", "F401"]
"dense_armor/utility/__init__.py" = ["F401"]
"test/usable/samples/*" = ["F401"]

[[tool.mypy.overrides]]
module = ["sounddevice", "pyulog", "pyulog.*", "pymavlink", "pymavlink.*", "paho.*", "yaml", "psutil", "scipy", "scipy.*", "zmq", "confluent_kafka", "quickfix"]
ignore_missing_imports = true


