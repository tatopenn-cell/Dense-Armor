[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-armor"
version = "1.1.32"
description = "Robot-AI Online Shielding & Learning: JAX estimators that learn one sample at a time, with streams, trees and forests, clustering, vision, uncertainty, drift and anomaly detection, protected learning and robot command safety"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Salvatore Pennacchio", email = "jtatopenn@libero.it" }]
requires-python = ">=3.10"
keywords = ["online-learning", "streaming", "robotics", "anomaly-detection", "drift-detection", "ai-safety", "robust-statistics", "jax"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = ["numpy", "jax", "psutil", "osqp", "scipy", "xacro"]

[project.optional-dependencies]
finance-stream = ["pyzmq>=25", "confluent-kafka>=2"]
audio = ["scipy"]
data = ["h5py", "netCDF4"]
quantum = ["dense-evolution"]
mcp = ["mcp>=2.0.0", "pydantic>=2.0"]
river = ["river>=0.26; python_version >= '3.11'"]
vision = ["opencv-python"]
drone = ["pyulog", "pymavlink", "paho-mqtt", "pyyaml"]
ros = ["rosbags>=0.9.18"]
llm = []  # the LLM bridge needs no extra package
dev = ["pytest", "pytest-cov", "filterpy", "matplotlib", "river>=0.26; python_version >= '3.11'", "scikit-learn"]
docs = [
    "mkdocs>=1.6.0",
    "ruff>=0.6",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
    "pymdown-extensions>=10.0,<11.0",
]

[project.urls]
Homepage = "https://github.com/tatopenn-cell/Dense-Armor"
Repository = "https://github.com/tatopenn-cell/Dense-Armor"
"Sister project (Dense-Evolution)" = "https://github.com/tatopenn-cell/Dense-Evolution"

[project.scripts]
dense-armor = "dense_armor.armatura:main"
dense-armor-mcp = "dense_armor.mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["dense_armor*", "pipelines*"]

[tool.ruff]
target-version = "py310"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[[tool.mypy.overrides]]
module = ["pyulog", "pyulog.*", "pymavlink", "pymavlink.*", "paho.*", "yaml", "psutil", "scipy", "scipy.*", "zmq", "confluent_kafka"]
ignore_missing_imports = true
