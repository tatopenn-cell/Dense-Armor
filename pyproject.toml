[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-armor"
version = "1.1.18"
description = "The wearable AI-safety shield: runtime anomaly damping for any AI signal - NaN-safe, drift-aware, dimension-agnostic, no retraining"
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE.md"]
authors = [{ name = "Salvatore Pennacchio", email = "jtatopenn@libero.it" }]
requires-python = ">=3.10"
keywords = ["anomaly-detection", "signal-processing", "drift-detection", "ai-safety", "robust-statistics", "jax"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = ["numpy", "jax", "psutil", "osqp", "scipy"]

[project.optional-dependencies]
audio = ["scipy"]
data = ["h5py", "netCDF4"]
quantum = ["dense-evolution"]
mcp = ["mcp>=2.0.0", "pydantic>=2.0"]
dev = ["pytest", "pytest-cov", "filterpy", "matplotlib"]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/tatopenn-cell/Dense-Armor"
Repository = "https://github.com/tatopenn-cell/Dense-Armor"
"Sister project (Dense-Evolution)" = "https://github.com/tatopenn-cell/Dense-Evolution"

[project.scripts]
dense-armor = "dense_armor.armatura:main"
dense-armor-mcp = "dense_armor.mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["dense_armor*"]
