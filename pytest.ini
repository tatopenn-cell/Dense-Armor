[pytest]
markers =
    needs_postgres: requires a PostgreSQL server (DENSE_ARMOR_TEST_PG_URL)
    needs_browser: requires Chromium via Playwright
    needs_fix: requires a running FIX acceptor
    slow: test that takes 3 seconds or more; the ones in test/slow_tests.txt are marked at collection, the CI skips them, run them locally with pytest -m slow
    training: test that trains a network for minutes; it runs in the workflow tests-slow
    heavy: test that takes more than 14 seconds; it runs in the workflow tests-slow
pythonpath = . tools
