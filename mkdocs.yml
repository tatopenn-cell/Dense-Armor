  - Shields:
      - shields/index.md
      - Armatura: shields/armatura.md
      - Orca: shields/orca.md
      - Hybrid engine: shields/hybrid_engine.md
      - Adaptive engine: shields/engine.md
  - Anomaly detection:
      - anomaly/index.md
      - Streaming: anomaly/streaming.md
      - Robust filters: anomaly/robust_filters.md
      - Curvature: anomaly/curvature.md
  - Drift detection:
      - drift/index.md
      - CUSUM and ARL theory: drift/cusum.md
      - Drift detectors: drift/detectors.md
  - Protection:
      - protect/index.md
      - Arbiter: protect/arbiter.md
  - Online learning:
      - learn/index.md
      - Calibration: learn/calibration.md
      - Metric learning: learn/metric_learning.md
      - Online classifiers: learn/online_classifiers.md
      - Online dynamics: learn/online_dynamics.md
  - Statistics:
